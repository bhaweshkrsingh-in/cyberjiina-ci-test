# cyberJiina security gate for GitHub Actions: copy this file to .github/workflows/cyberjiina.yml in YOUR repository.
#
# What it does: on every pull request it scans only the files the pull request changed (on a push to main it scans everything) with cyberJiina's scanners
# (gitleaks, Bandit, Semgrep + our custom rules, Ruff, pip-audit, npm audit; Trivy too in "deep" mode). No AI model and no API key are used.
# It uploads SARIF to GitHub's Security tab, posts a summary comment on the pull request, saves the SARIF/JSON/Markdown/CSV files as an artifact,
# and FAILS the check when a finding at or above `fail-on` exists.
#
# One-time setup: create a fine-grained personal access token (or a GitHub App token) with read access to the private repo JiinaAI/cyberJiina and save it as the
# repository secret CYBERJIINA_READ_TOKEN. Uploading SARIF to code scanning needs a public repo, or GitHub Advanced Security on a private one;
# without it the upload step reports an error but the scan, the comment and the pass/fail still work (the step is marked continue-on-error).
name: cyberJiina security scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  FAIL_ON: high          # none | low | medium | high | critical
  MODE: standard         # quick | standard | deep (deep adds Trivy: dependencies, secrets, Dockerfile misconfiguration)

jobs:
  cyberjiina:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out this repository (full history, so the pull request diff works)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out cyberJiina
        uses: actions/checkout@v4
        with:
          repository: JiinaAI/cyberJiina
          token: ${{ secrets.CYBERJIINA_READ_TOKEN }}
          path: .cyberjiina

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the scanner image (cached between runs)
        uses: docker/build-push-action@v6
        with:
          context: .cyberjiina/cyberjiina-libraries
          load: true
          tags: cyberjiina-libraries:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SCOPE="--scope diff --diff-base origin/$BASE_REF"
          else
            SCOPE="--scope full"
          fi
          python3 .cyberjiina/ci/cyberjiina_ci.py --repo . --mode "$MODE" $SCOPE --fail-on "$FAIL_ON" \
            --formats sarif,json,md,csv --out cyberjiina-results

      - name: Upload SARIF to the Security tab
        if: always() && hashFiles('cyberjiina-results/cyberjiina.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cyberjiina-results/cyberjiina.sarif
          category: cyberjiina

      - name: Save the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberjiina-results
          path: cyberjiina-results/

      - name: Comment the summary on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('cyberjiina-results/cyberjiina.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file cyberjiina-results/cyberjiina.md
